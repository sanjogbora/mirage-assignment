<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Companion Device</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Three.js for 3D Ball -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Device Frame -->
        <div class="device-frame">
            <!-- Screen Area -->
            <div class="device-screen" id="screen">
                <!-- Dynamic content -->
            </div>

            <!-- 3D Interactive Ball -->
            <div class="ball-container">
                <div class="ball-3d" id="ball"></div>
                <div class="ball-instruction">Drag or scroll to control</div>
            </div>

            <!-- Feedback Toast -->
            <div class="feedback-toast" id="feedback-toast"></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Screen</span>
                <span class="status-value" id="current-screen">Home</span>
            </div>
            <div class="status-item">
                <span class="status-label">Action</span>
                <span class="status-value" id="last-action">Ready</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
